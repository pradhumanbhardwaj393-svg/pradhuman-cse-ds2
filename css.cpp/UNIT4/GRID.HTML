<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  html. * {
    margin: 0px;
    padding:0px;
   box-sizing: border-box;
}
main{
    width: 1200px;
    height: 400px;
    background-color: white;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(1,1fr);
    gap: 20px ;
    
}
.box:nth-child(odd){
    background-color: black;
    height: 300px;
}
.box:nth-child(even)
{
    background-color: aqua;
    height: 300px;

}
/* @media screen and ( max-width:768px){
    main {
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 20px;
    }
} */
@media screen and ( min-width:375px ) and (max-width: 768px){
    main {
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 20px;
    }
}
#lft_rgt{
    display: grid;
    grid-template-columns: repeat(2,1fr);

}
    </style>
</head>
<body>
    <main>
       <div class="box">1</div>
       <div class="box">2</div>
       <div class="box">3</div>
       <div class="box">4</div>

    </main>
</body>
</html>

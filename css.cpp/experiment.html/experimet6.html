<!DOCTYPE html>
<html lang="en">
<head>

    <title>experiment6</title>
     <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .body {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .product-box {
            display: flex;
            gap: 30px;
            padding: 20px;
        }

        .product-image {
            width: 300px;
            height: 350px;
            border: 2px solid #ccc;
            padding: 10px;
            background-color: #fafafa;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-details h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .price {
            font-size: 22px;
            color: #e60000;
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        .buy-btn {
            background-color: #28a745;
            color: white;
            padding: 12px 25px;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #1f7e33;
        }

        .buy-btn:hover {
            background-color: #218838;
        }
    </style> 
</head>
